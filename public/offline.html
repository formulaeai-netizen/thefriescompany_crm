<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12151F" />
    <title>Fry Guys CRM - Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --card: #111a2e;
        --text: #e5eaf3;
        --muted: #93a0b8;
        --gold: #f5a623;
        --border: #1f2a44;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(100%, 420px);
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        padding: 28px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      strong {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192.png" alt="Fry Guys" />
      <h1>Fry Guys CRM</h1>
      <p>
        <strong>You&apos;re offline.</strong><br />Reconnect to continue working with live business
        data.
      </p>
    </main>
  </body>
</html>
